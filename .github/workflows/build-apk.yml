name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found version $JAVA_VERSION"
            exit 1
          fi
          echo "Java version verification passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore verified successfully."
          else
            echo "Error: Failed to create debug.keystore"
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            echo "Discovering discovered APKs in app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty"
            exit 1
          fi
          echo "APK verified successfully at $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare-asset
        run: |
          ASSET_DIR=$(mktemp -d)
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          }
          RUN_NUMBER="${{ github.run_number }}"
          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          DEST_PATH="$ASSET_DIR/$ASSET_NAME"
          cp app/build/outputs/apk/debug/app-debug.apk "$DEST_PATH"
          echo "asset_path=$DEST_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare-asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare-asset.outputs.asset_name }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset not found or empty."
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES="This is an automatically generated debug APK.
          - Built by GitHub Actions.
          - Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit: ${{ github.sha }}
          - Intended for testing purposes.
          - Not a Play Store production release.
          - Signed only with a temporary debug keystore."

          gh release create "$TAG_NAME" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest \
            "$ASSET_PATH#$ASSET_NAME"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish-release.outcome }}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release publishing succeeded."
            gh release view "$TAG_NAME" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
            echo "Release Page URL: $RELEASE_URL"
            echo "### GitHub Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Download Page**: [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename**: \`${{ steps.prepare-asset.outputs.asset_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: Release publishing failed or was skipped, but the APK build and Actions artifact upload succeeded."
            echo "### GitHub Release Publishing Warning" >> $GITHUB_STEP_SUMMARY
            echo "- The APK build and Actions artifact upload succeeded." >> $GITHUB_STEP_SUMMARY
            echo "- Release publishing encountered an issue or failed." >> $GITHUB_STEP_SUMMARY
            echo "- The normal Actions artifact named \`app-debug-apk\` remains available as a backup." >> $GITHUB_STEP_SUMMARY
          fi
